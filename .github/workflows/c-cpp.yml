name: DSTW CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
    - name: "Checkout repository"
      uses: actions/checkout@v3
      with:
         submodules: 'true'

    - name: build and run all
      run: chmod 755 scripts/*.sh; scripts/buildAndRun.sh

    - name: run system tests
      run: scripts/runSystemTests.sh

    - name: check coverage
      run: scripts/runGcov.sh

    # - name: check env
    #   run: scripts/checkEnv.sh
