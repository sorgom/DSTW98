name: DSTW

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v3
      with:
         submodules: 'true'

    - name: build and run all
      run: chmod 755 scripts/*.sh; scripts/buildAndRun.sh

    - name: system tests
      run: scripts/systemtests.sh

    - name: gcov
      run: scripts/gcov.sh

    # - name: check env
    #   run: scripts/checkEnv.sh
