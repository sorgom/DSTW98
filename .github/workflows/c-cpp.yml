name: DSTW

on:
  push:
    branches: [ 'dev98', 'dev17' ]
  pull_request:
    branches: [ 'dev98', 'dev17' ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v3
      with:
         submodules: 'true'

    - name: module tests
      run: python3 scripts/moduletests.py

    - name: system tests
      run: python3 scripts/systemtests.py

    - name: gcov
      run: chmod +x scripts/*.sh; scripts/gcov.sh

    - name: check env
      run: scripts/checkEnv.sh
